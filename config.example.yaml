# Copy to config.yaml, then: aichess play --config config.yaml
match:
  max_plies: 300
  move_timeout_seconds: 60
  illegal_move_retries: 3
  on_failure: forfeit          # forfeit | random_move

white:
  type: llm
  model: claude-opus-5-5
  show_legal_moves: true
  # temperature: 0.3           # optional; omit to use the model default

black:
  type: stockfish
  # path: /opt/homebrew/bin/stockfish   # default: found on PATH
  skill_level: 8               # 0-20  (or use elo: 1500)
  movetime: 0.2

output:
  dir: games
  save_pgn: true
  save_jsonl: true
  display: terminal            # terminal | none  (use --web for the browser UI)
  show_board: true
