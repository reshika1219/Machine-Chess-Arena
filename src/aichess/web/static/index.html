<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machine Chess Arena</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <div class="brand"><span class="mark">♞</span>Machine Chess Arena</div>
  <nav id="tabs">
    <button data-tab="live" class="tab active">Live</button>
    <button data-tab="games" class="tab">Games</button>
    <button data-tab="tournaments" class="tab">Tournaments</button>
  </nav>
  <div id="badges"></div>
</header>
<div class="hairline"></div>

<!-- one game viewer, shared by the Live and Games tabs -->
<main id="view-game">
  <section id="matchup" class="matchup" aria-label="Matchup"></section>
  <aside id="picker" class="card hidden">
    <input id="filter" type="search" placeholder="Filter games…">
    <div id="gamelist"></div>
  </aside>

  <section class="boardcol">
    <div class="player" id="top-player"></div>
    <div class="boardwrap">
      <div id="evalbar" title="Evaluation (White's point of view)"><div id="evalfill"></div><span id="evaltext"></span></div>
      <div id="board" role="img" aria-label="Chess board"></div>
    </div>
    <div class="player" id="bottom-player"></div>
    <div class="nav">
      <button id="b-first" class="secondary" title="Start (Home)" aria-label="Start">«</button>
      <button id="b-prev" class="secondary" title="Back (←)" aria-label="Back">‹</button>
      <button id="b-next" class="secondary" title="Forward (→)" aria-label="Forward">›</button>
      <button id="b-last" class="secondary" title="Latest (End)" aria-label="Latest">»</button>
      <button id="b-auto" class="secondary hidden" title="Auto-play replay (Space)">Auto</button>
      <button id="b-flip" class="secondary" title="Flip board (F)">Flip</button>
    </div>
    <div class="hint">← → step &nbsp;·&nbsp; Home / End jump &nbsp;·&nbsp; F flip &nbsp;·&nbsp; Space auto-play</div>
  </section>

  <section class="side">
    <div class="card" id="statuscard">
      <div class="statusrow"><span id="pulse" class="pulse"></span><div id="status">Connecting…</div></div>
      <div class="controls" id="livecontrols">
        <div class="btns">
          <button id="play">Play</button>
          <button id="pause" class="secondary">Pause</button>
          <button id="step" class="secondary">Step</button>
        </div>
        <label class="delay"><span class="dlabel">Delay</span><input id="speed" type="range" min="0" max="5" step="0.25" value="1"><span class="dval"><span id="dv">1.0</span>s</span></label>
      </div>
      <div class="controls hidden" id="replaycontrols">
        <button id="analyse" class="secondary">Analyse with Stockfish</button>
        <span id="analysenote" class="muted"></span>
      </div>
    </div>
    <div class="card"><div class="cardtitle">Evaluation</div><svg id="graph" viewBox="0 0 300 70" preserveAspectRatio="none"></svg><div id="graphnote" class="empty"></div></div>
    <div class="card"><div class="cardtitle">Moves</div><div id="moves"></div></div>
    <div class="card"><div class="cardtitle">Move details</div><div id="detail"><div class="empty">Select a move to see its reasoning.</div></div></div>
    <div class="card"><div class="cardtitle">Commentary</div><div id="commentary"><div class="empty">No commentary.</div></div></div>
  </section>
</main>

<main id="view-tournaments" class="hidden">
  <aside class="card"><div class="cardtitle">Tournaments</div><div id="tlist"></div></aside>
  <section id="tdetail" class="tournament"></section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
